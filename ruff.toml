# Rule set pinned so a later --fix cannot strip a noqa it does not currently
# understand, which is how an F401 quietly came back in run_all.py once.
line-length = 120

[lint]
select = ["E", "F", "I", "B", "RUF", "PLC"]
ignore = ["E501", "RUF046"]

[lint.per-file-ignores]
# Every entry point puts src/ on the path before importing from it, so the
# imports cannot sit at the top. matplotlib additionally needs its backend
# chosen before pyplot loads.
"run_all.py" = ["E402", "PLC0415"]
"export_web_data.py" = ["E402"]
"make_figures.py" = ["E402"]
"deck/deck_figures.py" = ["E402"]
"tests/test_conformal.py" = ["E402", "PLC0415"]  # corpus loaders imported inside the slow tests only
# nltk is imported lazily inside the loaders so importing the module does not
# pull in the corpus machinery.
"src/data.py" = ["PLC0415"]
